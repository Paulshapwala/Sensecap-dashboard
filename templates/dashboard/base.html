<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Weather Dashboard{% endblock %}</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; }
        nav { background: #333; color: white; padding: 10px; margin-bottom: 20px; }
        nav a { color: white; text-decoration: none; margin-right: 20px; }
    </style>
</head>
<body>
    <nav>
        <h2>Weather Dashboard</h2>
        <a href="{% url 'dashboard:live' %}">Live</a>
        <a href="{% url 'dashboard:history' %}">History</a>
        <a href="{% url 'dashboard:logout' %}">Logout</a>
    </nav>
    
    {% block content %}{% endblock %}
</body>
</html>
