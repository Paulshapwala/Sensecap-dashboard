{% extends "base.html" %}

{% block title %}Weather History{% endblock %}

{% block content %}
<h1>Weather History</h1>
<p>Historical data and charts will appear here</p>

<div style="margin: 20px 0; padding: 20px; background: #f5f5f5; border-radius: 8px;">
    <label style="margin-right: 20px;">
        Start Date: 
        <input type="date" id="start-date" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </label>
    <label style="margin-right: 20px;">
        End Date: 
        <input type="date" id="end-date" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </label>
    <button onclick="loadHistory()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Load History
    </button>
</div>

<div id="chart-container" style="margin-top: 20px;"></div>

<script>
    const DATA_HISTORY_URL = "{% url 'dashboard:data_history' %}";

    async function loadHistory() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        if (!startDate || !endDate) {
            alert('Please select both a start and end date.');
            return;
        }

        // Send dates as simple ISO strings (backend handles timezone conversion)
        const start = `${startDate}T00:00:00`;
        const end = `${endDate}T23:59:59`;

        const url = `${DATA_HISTORY_URL}?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;

        try {
            const response = await fetch(url, {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                },
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                console.error('Error loading history:', response.status, err);
                alert(err.error || `Request failed with status ${response.status}`);
                return;
            }

            const data = await response.json();
            console.log('Loaded readings:', data.readings);
            renderHistory(data.readings);
        } catch (e) {
            console.error('Network or parsing error:', e);
            alert('Something went wrong loading the history.');
        }
    }

    function renderHistory(readings) {
        const container = document.getElementById('chart-container');
        if (!readings || readings.length === 0) {
            container.innerHTML = '<p style="color: #999;">No readings found for that range.</p>';
            return;
        }

        // Format time for display (backend already returns times in user's timezone)
        const rows = readings.map(r => {
            const date = new Date(r.time);
            const formattedTime = date.toLocaleString();
            
            return `
                <tr>
                    <td style="padding: 8px; border: 1px solid #ddd;">${formattedTime}</td>
                    <td style="padding: 8px; border: 1px solid #ddd;">${r.device_id}</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right;">${r.temperature ?? '--'}</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right;">${r.humidity ?? '--'}</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right;">${r.pressure ?? '--'}</td>
                </tr>
            `;
        }).join('');

        container.innerHTML = `
            <table style="width: 100%; border-collapse: collapse; background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
                <thead style="background: #f5f5f5;">
                    <tr>
                        <th style="padding: 12px; text-align: left; border: 1px solid #ddd; font-weight: bold;">Time (Local)</th>
                        <th style="padding: 12px; text-align: left; border: 1px solid #ddd; font-weight: bold;">Device</th>
                        <th style="padding: 12px; text-align: right; border: 1px solid #ddd; font-weight: bold;">Temp (°C)</th>
                        <th style="padding: 12px; text-align: right; border: 1px solid #ddd; font-weight: bold;">Humidity (%)</th>
                        <th style="padding: 12px; text-align: right; border: 1px solid #ddd; font-weight: bold;">Pressure (hPa)</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                </tbody>
            </table>
        `;
    }
</script>
{% endblock %}
